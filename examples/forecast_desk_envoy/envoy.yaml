# Envoy's configuration for the stack in compose.yaml, written with
#   python -m inspect_sentinel.sidecar.envoy --sidecar-host sidecar > envoy.yaml
# Write it again rather than editing it: tests/sidecar/test_envoy_shim.py checks
# it is what that command writes.
# Generated by inspect_sentinel for Envoy 1.39.4.
overload_manager:
  resource_monitors:
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      '@type': type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 16384
static_resources:
  listeners:
  - name: model_api
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    per_connection_buffer_limit_bytes: 67108864
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: model_api
          codec_type: AUTO
          http_protocol_options:
            enable_trailers: true
          stream_idle_timeout: 0s
          route_config:
            name: model_api
            virtual_hosts:
            - name: model_api
              domains:
              - '*'
              routes:
              - match:
                  path: /v1/messages/count_tokens
                route:
                  cluster: anthropic
                  host_rewrite_literal: api.anthropic.com
                  timeout: 0s
                request_headers_to_add:
                - header:
                    key: accept-encoding
                    value: identity
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                request_headers_to_remove:
                - x-inspect-context
                - x-irid
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    disabled: true
              - match:
                  path: /v1/messages
                route:
                  cluster: anthropic
                  host_rewrite_literal: api.anthropic.com
                  timeout: 0s
                request_headers_to_add:
                - header:
                    key: accept-encoding
                    value: identity
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                request_headers_to_remove:
                - x-inspect-context
                - x-irid
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    overrides:
                      grpc_initial_metadata:
                      - key: sentinel-format
                        value: anthropic-messages
                      - key: sentinel-provider
                        value: anthropic
              - match:
                  path: /v1/chat/completions
                route:
                  cluster: openai
                  host_rewrite_literal: api.openai.com
                  timeout: 0s
                request_headers_to_add:
                - header:
                    key: accept-encoding
                    value: identity
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                request_headers_to_remove:
                - x-inspect-context
                - x-irid
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    overrides:
                      grpc_initial_metadata:
                      - key: sentinel-format
                        value: openai-chat
                      - key: sentinel-provider
                        value: openai
              - match:
                  path: /v1/responses
                route:
                  cluster: openai
                  host_rewrite_literal: api.openai.com
                  timeout: 0s
                request_headers_to_add:
                - header:
                    key: accept-encoding
                    value: identity
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                request_headers_to_remove:
                - x-inspect-context
                - x-irid
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    overrides:
                      grpc_initial_metadata:
                      - key: sentinel-format
                        value: openai-responses
                      - key: sentinel-provider
                        value: openai
              - match:
                  prefix: /sentinel/
                route:
                  cluster: sentinel_sidecar
                  timeout: 0s
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    disabled: true
              - match:
                  prefix: /
                direct_response:
                  status: 404
                  body:
                    inline_string: 'This proxy serves only the model routes the sentinel
                      judges.

                      '
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    disabled: true
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc:
                  cluster_name: sentinel_shim
              failure_mode_allow: false
              message_timeout: 3600s
              processing_mode:
                request_header_mode: SEND
                request_body_mode: BUFFERED
                request_trailer_mode: SKIP
                response_header_mode: SEND
                response_body_mode: FULL_DUPLEX_STREAMED
                response_trailer_mode: SEND
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: sentinel_shim
    type: LOGICAL_DNS
    dns_lookup_family: V4_PREFERRED
    connect_timeout: 5s
    load_assignment:
      cluster_name: sentinel_shim
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: sidecar
                port_value: 8902
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    circuit_breakers:
      thresholds:
      - max_requests: 65536
        max_pending_requests: 65536
  - name: sentinel_sidecar
    type: LOGICAL_DNS
    dns_lookup_family: V4_PREFERRED
    connect_timeout: 5s
    load_assignment:
      cluster_name: sentinel_sidecar
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: sidecar
                port_value: 8900
  - name: anthropic
    type: LOGICAL_DNS
    dns_lookup_family: V4_PREFERRED
    connect_timeout: 5s
    load_assignment:
      cluster_name: anthropic
      endpoints:
