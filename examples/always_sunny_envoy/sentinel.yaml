# What the sidecar runs, and how it serves. Envoy's side is envoy.yaml.
sentinel:
  # the always_sunny rule: `weather_rules` is the package in rule/, which
  # Dockerfile.sidecar installs, and inspect_ai finds by its entry point
  name: weather_rules/always_sunny
server:
  # inside the stack, where only Envoy reaches the sidecar
  host: 0.0.0.0
  # the endpoints for proxies and for evals; Envoy sends /sentinel/ here
  port: 8900
  envoy:
    # the Envoy shim, which Envoy's ext_proc filter calls over gRPC
    port: 8902
  # the default: a rejected turn is refused with a final status, which an
  # Inspect that reads the sidecar's decisions turns into the model's turn.
  # For an Inspect that doesn't, use 503 (see README.md).
  reject_status: 400
