[project]
name = "inspect_sentinel"
dynamic = ["version"]
description = "Monitors and control protocols that watch agents and intervene in their execution."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
# Tracks inspect-ai's floor rather than the 3.12 that sibling packages use:
# the design has inspect-ai depending on this package (design/sentinel.md,
# "Packages"), and a dependency cannot require a newer Python than the
# package that depends on it.
requires-python = ">=3.11"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # The wire types a monitor reads (ChatMessage, ToolCall, ModelOutput) live
    # in inspect-ai today. design/inspect-core.md describes extracting them
    # into a leaf package; when that lands this dependency narrows to it.
    #
    # Development tracks inspect_ai's `main`, because sentinel and inspect_ai
    # co-develop and most sentinel changes need hooks that have not shipped.
    # The git ref never reaches PyPI: release-pin-deps.yml rewrites it to a
    # `>=<latest>` floor on the Release Please release PR, and
    # release-dep-guard.yml blocks the release if it is still a git ref.
    "inspect-ai>=0.3.281",
    # Report types are pydantic models and are imported directly; a
    # transitive dependency is not a promise.
    "pydantic>=2.0",
    # The runner fans children out on anyio task groups. inspect-ai depends on
    # anyio too, but this is a direct import and a transitive dependency is not
    # a promise.
    "anyio>=4.0",
]

[project.urls]
"Source Code" = "https://github.com/meridianlabs-ai/inspect_sentinel"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_sentinel/issues"
Documentation = "https://meridianlabs-ai.github.io/inspect_sentinel/"

[project.entry-points.inspect_ai]
inspect_sentinel = "inspect_sentinel._entrypoint"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# What serving a sidecar needs. inspect-ai depends on both too, but they are
# imported directly here, and a transitive dependency is not a promise.
# starlette's floor is the first release with a fix for every advisory
# published against it. uvicorn's is the first that hands a signal on to a
# second server in the same process, which stopping the sidecar relies on.
sidecar = ["starlette>=1.3.1", "uvicorn>=0.29.0"]
# The sidecar reads a provider's traffic with that provider's SDK, as
# inspect-ai does, so each is installed only where it is wanted. The floors
# are inspect-ai's own.
anthropic = ["anthropic>=1.0.0"]
openai = ["openai>=3.4.0"]
dev = [
    "ruff",
    "pytest",
    "pyright",
    "pytest-xdist",
    "pytest-timeout>=2.4.0",
    # async tests run on both anyio backends (tests/conftest.py)
    "trio",
    # step_as_str renders with Scout's messages_as_str, imported when called;
    # not a runtime dependency until message rendering settles (it is to move
    # from Scout into inspect_ai, design/pr-series.md)
    "inspect-scout",
    # the sidecar's tests read recorded Anthropic and OpenAI traffic, call its
    # server through httpx, and hold its answers to its schema file
    "inspect_sentinel[anthropic,openai,sidecar]",
    "httpx",
    "jsonschema",
    "inspect_sentinel[doc]",
]
doc = [
    "jupyter",
    "panflute",
    "markdown",
    "griffe>=2",
    "rich",
    "pyyaml",
    "types-PyYAML",
    "quarto-cli>=1.9.36",
]
dist = ["twine", "build"]

# lets `uv sync --group dev` keep working; the lists live in the extras above
[dependency-groups]
dev = ["inspect_sentinel[dev]"]

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/", "design/"]
artifacts = ["src/**/py.typed"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_sentinel/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

# hatchling rejects PEP 508 direct references (the inspect-ai git ref above)
# without this
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
managed = true

[tool.ruff]
extend-exclude = ["docs", "design"]
src = [".", "src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 120

[tool.pyright]
# src/proxies is left out: a proxy hook imports its proxy, which is never in
# this environment. `make check-litellm` checks the LiteLLM guardrail in one
# of its own.
include = ["src/inspect_sentinel", "tests", "examples"]
typeCheckingMode = "strict"
pythonPlatform = "All"
pythonVersion = "3.11"

# tests may exercise private helpers directly
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
# shared fakes are imported as `tests._fakes`, which pytest resolves from the
# repo root; give pyright the same root
extraPaths = ["."]

# examples import their shared tasks and each other as top-level modules, as
# `inspect eval examples/<file>.py` resolves them
[[tool.pyright.executionEnvironments]]
root = "examples"
extraPaths = ["examples"]
