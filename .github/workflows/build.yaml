name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv venv
          # Track inspect_ai and inspect_scout main everywhere EXCEPT the release
          # PR, where we validate against the shipped versions pulled in via .[dev]
          # below. One command, so scout's inspect-ai requirement resolves to
          # the git inspect_ai rather than a release.
          if [ "$HEAD_REF" != "release-please--branches--main" ]; then
            # temporary: the inspect_ai client this branch needs, until it
            # lands; back to inspect_ai's main before this branch merges
            uv pip install \
              git+https://github.com/petetronic/inspect_ai.git@feat/sentinel-sidecar-client \
              git+https://github.com/meridianlabs-ai/inspect_scout.git
          fi
          uv pip install -e ".[dev]"
      - name: Run pyright
        run: .venv/bin/pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv venv
          # Track inspect_ai and inspect_scout main everywhere EXCEPT the release
          # PR, where we validate against the shipped versions pulled in via .[dev]
          # below. One command, so scout's inspect-ai requirement resolves to
          # the git inspect_ai rather than a release.
          if [ "$HEAD_REF" != "release-please--branches--main" ]; then
            # temporary: the inspect_ai client this branch needs, until it
            # lands; back to inspect_ai's main before this branch merges
            uv pip install \
              git+https://github.com/petetronic/inspect_ai.git@feat/sentinel-sidecar-client \
              git+https://github.com/meridianlabs-ai/inspect_scout.git
          fi
          uv pip install -e ".[dev]"
      - name: Run tests
        # .venv/bin directly, not `uv run`: there is no uv.lock, so `uv run`
        # would lock and sync, and could replace the git-installed inspect_ai
        # and inspect_scout above with a registry resolution.
        run: .venv/bin/pytest

  # The LiteLLM guardrail is a package of its own, which runs in LiteLLM's
  # process and never beside this one, so it is tested and checked in an
  # environment of its own for each LiteLLM version it supports.
  litellm-guardrail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        litellm-version: ["1.83.0", "1.105.0"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install the sidecar, which the tests start
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv venv
          # Track inspect_ai and inspect_scout main everywhere EXCEPT the release
          # PR, where we validate against the shipped versions pulled in via .[dev]
          # below. One command, so scout's inspect-ai requirement resolves to
          # the git inspect_ai rather than a release.
          if [ "$HEAD_REF" != "release-please--branches--main" ]; then
            # temporary: the inspect_ai client this branch needs, until it
            # lands; back to inspect_ai's main before this branch merges
            uv pip install \
              git+https://github.com/petetronic/inspect_ai.git@feat/sentinel-sidecar-client \
              git+https://github.com/meridianlabs-ai/inspect_scout.git
          fi
          uv pip install -e ".[dev]"
      - name: Run the guardrail's tests
        run: make test-litellm LITELLM=${{ matrix.litellm-version }}
      - name: Run pyright on the guardrail
        run: make check-litellm LITELLM=${{ matrix.litellm-version }}

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Install the package
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          uv venv
          # Track inspect_ai and inspect_scout main everywhere EXCEPT the release
          # PR, where we validate against the shipped versions the wheel pulls
          # in below. One command, so scout's inspect-ai requirement resolves to
          # the git inspect_ai rather than a release.
          if [ "$HEAD_REF" != "release-please--branches--main" ]; then
            # temporary: the inspect_ai client this branch needs, until it
            # lands; back to inspect_ai's main before this branch merges
            uv pip install \
              git+https://github.com/petetronic/inspect_ai.git@feat/sentinel-sidecar-client \
              git+https://github.com/meridianlabs-ai/inspect_scout.git
          fi
          uv pip install dist/*.whl
      - name: Verify package
        # -I so the import resolves to the installed wheel, not a module at the
        # checkout root.
        run: |
          .venv/bin/python -I -c "import inspect_sentinel, inspect_scout; print('Package imported successfully')"
      - name: Build the LiteLLM guardrail
        run: uv build src/proxies/litellm --out-dir dist-litellm
      - name: Verify the LiteLLM guardrail
        # LiteLLM pinned, as in the litellm-guardrail job: the wheel alone
        # would take the newest release
        run: |
          uv run --no-project --with dist-litellm/*.whl --with "litellm[proxy]==1.105.0" python -c "import inspect_sentinel_litellm; print('Guardrail imported successfully')"
