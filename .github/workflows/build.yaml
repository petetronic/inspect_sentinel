name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pyright
        run: uv run pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  # The LiteLLM guardrail is a package of its own, which runs in LiteLLM's
  # process and never beside this one, so it is tested and checked in an
  # environment of its own for each LiteLLM version it supports.
  litellm-guardrail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        litellm-version: ["1.83.0", "1.105.0"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install the sidecar, which the tests start
        run: uv sync --group dev
      - name: Run the guardrail's tests
        run: make test-litellm LITELLM=${{ matrix.litellm-version }}
      - name: Run pyright on the guardrail
        run: make check-litellm LITELLM=${{ matrix.litellm-version }}

  # The Middleman hook is a package of its own too, which runs in Middleman's
  # process, so it is tested and checked in an environment of its own: with
  # the latest versions of its dependencies, and with the lowest it allows,
  # which are Middleman's own.
  # Off until Hawk accepts Middleman's passthrough hook, which the hook is for.
  middleman-hook:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            dependencies: latest
          - python-version: "3.14"
            dependencies: latest
          - python-version: "3.11"
            dependencies: lowest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install the sidecar, which the tests start
        run: uv sync --group dev
      - name: Run the hook's tests
        run: make test-middleman LOWEST=${{ matrix.dependencies == 'lowest' && '1' || '' }}
      - name: Run pyright on the hook
        if: matrix.dependencies == 'latest'
        run: make check-middleman

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # .python-version pins the dev interpreter; without this uv uses it
      # rather than the matrix version
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Verify package
        run: |
          uv run --with dist/*.whl python -c "import inspect_sentinel; print('Package imported successfully')"
      - name: Build the LiteLLM guardrail
        run: uv build src/proxies/litellm --out-dir dist-litellm
      - name: Verify the LiteLLM guardrail
        run: |
          uv run --no-project --with dist-litellm/*.whl python -c "import inspect_sentinel_litellm; print('Guardrail imported successfully')"
      # off until Hawk accepts Middleman's passthrough hook, as is the
      # middleman-hook job
      - name: Build the Middleman hook
        if: false
        run: uv build src/proxies/middleman --out-dir dist-middleman
      - name: Verify the Middleman hook
        if: false
        run: |
          uv run --no-project --with dist-middleman/*.whl python -c "import inspect_sentinel_middleman; print('Hook imported successfully')"
